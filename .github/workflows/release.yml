name: Release

on:
  push:
    branches:
      - main
      - '*.x'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Keeps the Release PR current; when a merged Release PR is pending, creates the tag
      # and the GitHub Release at its merge commit.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  # The GitHub Release above is created with GITHUB_TOKEN, which never starts another
  # workflow run, so publishing chains here instead of on a release event.
  test-unit:
    name: Test (unit)
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'not integration'
    secrets: inherit

  test-integration:
    name: Test (integration)
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'integration'
    secrets: inherit

  publish:
    name: 📦 Publish to PyPI
    needs: [release, test-unit, test-integration]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing is bound to this workflow file name and this environment.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          # uv build and uv publish execute project and dependency code, and nothing
          # here writes to the repository, so do not leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: ./.github/actions/python-uv-setup

      - name: Build distributions
        run: rm -rf dist && uv build

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish

      - name: Verify pip install
        env:
          UV_NO_SOURCES: "1"
        run: |
          uv pip install "getstream==${{ needs.release.outputs.version }}" || \
            echo "WARNING: pip install verification failed (PyPI index may need a moment to propagate)"
