name: Release

on:
  push:
    branches:
      - main
      - '*.x'
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Existing tag to (re)publish to PyPI, e.g. v6.1.1. Leave empty for a normal release run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Reversible half: keep the Release PR current. Stands down only while a release is
  # already pending, because until that one is tagged there is no release commit to stop
  # the walk at and it would propose the same commits again in a second Release PR.
  release-pr:
    name: Release PR
    needs: detect
    if: needs.detect.outputs.pending != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-release: true

  # Tagging and the GitHub Release are irreversible, so the suite has to run before
  # them, which means knowing a release is pending before the suite starts. The tag
  # lands on the merged Release PR's merge commit while the suite runs on this
  # workflow's own commit, so `ready` also requires those to be the same commit. They
  # are, on the path that matters: the push of that merge.
  detect:
    name: Detect pending release
    if: >-
      (github.event_name == 'push' || inputs.publish_tag == '') &&
      (github.ref_name == 'main' || endsWith(github.ref_name, '.x'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pending: ${{ steps.find.outputs.pending }}
      ready: ${{ steps.find.outputs.ready }}
    steps:
      - name: Find a merged Release PR waiting to be tagged
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pending=false
          ready=false

          # Query the label directly. Listing closed PRs and filtering client-side loses
          # a release that has slipped past the first page, which reads as "nothing to
          # release" and passes. Filter before picking, too: a hotfix branch can hold
          # its own pending release, and taking the newest label match would drop this
          # branch's release on every run until the other one clears.
          nums="$(gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -X GET -f state=closed -f labels='autorelease: pending' -f per_page=20 \
            --jq '.[] | select(.pull_request != null) | .number')"

          num=""
          sha=""
          for n in $nums; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" \
              --jq 'select(.merged_at != null and .base.ref == env.BASE) | .merge_commit_sha // empty')"
            if [ -n "$sha" ]; then
              num="$n"
              break
            fi
          done

          if [ -z "$sha" ]; then
            echo "No pending release on ${BASE}."
          elif [ "$sha" != "$HEAD_SHA" ]; then
            # Reached when an earlier release run failed after the Release PR merged.
            # Tagging $sha here would tag a tree this run never tested, and failing
            # would redden every later push, so stand down and say why.
            pending=true
            echo "::warning::Release PR #${num} is still pending at ${sha}, which is not this run's commit ${HEAD_SHA}. Re-run the workflow run for ${sha} to finish that release."
          else
            pending=true
            ready=true
            echo "Pending release #${num} will be tagged at ${sha}."
          fi

          {
            echo "pending=${pending}"
            echo "ready=${ready}"
          } >> "$GITHUB_OUTPUT"

  test-unit:
    name: Test (unit)
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'not integration'
    secrets: inherit

  test-integration:
    name: Test (integration)
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'integration'
    secrets: inherit

  # Irreversible half.
  release:
    name: 🚀 Tag and release
    needs: [detect, test-unit, test-integration]
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true

  # Chained rather than triggered on the release event, because a GitHub Release
  # created with GITHUB_TOKEN starts no new workflow run. Also reachable on its own
  # through workflow_dispatch with publish_tag, which is the recovery path once
  # GitHub has retired the original run and "Re-run failed jobs" is gone.
  publish:
    name: 📦 Publish to PyPI
    needs: release
    if: >-
      !cancelled() &&
      (inputs.publish_tag != '' || needs.release.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PyPI Trusted Publishing is bound to this workflow file name and this environment.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve tag
        id: target
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          tag="${PUBLISH_TAG:-$RELEASE_TAG}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.tag }}
          # uv build and uv publish execute project and dependency code, and nothing
          # here writes to the repository, so do not leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: ./.github/actions/python-uv-setup

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish

      - name: Verify pip install
        env:
          UV_NO_SOURCES: "1"
        run: |
          uv pip install "getstream==${{ steps.target.outputs.version }}" || \
            echo "WARNING: pip install verification failed (PyPI index may need a moment to propagate)"
