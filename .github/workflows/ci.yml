name: CI (unit)
on:
  # main and *.x are excluded: release.yml runs the same reusable workflow on those
  # branches as the gate before tagging, and both firing on one push would double the
  # live legs against the Stream app several SDK repos share.
  push:
    branches-ignore: [ main, "*.x" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  unit:
    uses: ./.github/workflows/run_tests.yml
    with:
      marker: 'not integration'
    secrets: inherit

# Cancel in-flight runs for the same branch/PR when new commits arrive
concurrency:
  group: ci-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
