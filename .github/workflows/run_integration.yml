name: _run-integration
on:
  workflow_call:
    secrets: { }

# Serialize every integration run on a branch instead of cancelling: the daily schedule and
# release.yml's pre-tag gate both target main, and `github.workflow` inside a reusable
# workflow resolves to the *caller's* name, so keying the group on it would put them in
# separate lanes and fire two suites at the shared Stream app at once. cancel-in-progress
# stays false so a scheduled run can never cancel the gate a release is waiting on.
concurrency:
  group: run-integration-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"

permissions:
  contents: read

# The integration lane, and the only place `-m integration` runs. It is advisory: it runs
# daily and again before a tag, never as a status check on a pull request. The suite talks
# to a live Stream app that five SDK repos share, so another repo's run or a backend
# regression can redden it with nothing wrong here.
#
# Only the video half is here on purpose. Every `@pytest.mark.integration` in the repo is
# under tests/rtc or in the two *_manual.py files, and `make test` ignores both, so a
# non-video leg would collect nothing and the Makefile would report that as success. Add
# the leg back the day the chat and feeds suites carry the marker.
jobs:
  integration-video:
    name: 🧪 Video integration (${{ matrix.python-version }})
    environment:
      name: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run integration tests
        env:
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
        run: make test-video MARKER="integration"
