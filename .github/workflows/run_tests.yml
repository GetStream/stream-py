name: _run-tests
on:
  workflow_call:
    inputs:
      marker:
        description: 'pytest -m expression (e.g., `not integration` or `integration`)'
        required: true
        type: string
    secrets: { }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.marker }}
  cancel-in-progress: true

env:
  # If set, uv will run without updating the uv.lock file. Equivalent to the `uv run --frozen`.
  UV_FROZEN: "1"

permissions:
  contents: read

# Every job below skips on a Release PR. release-please only bumps the version and rewrites
# the changelog, and every source commit in one already passed this suite on the PR it came
# from. The guard sits on each job rather than on the calling job in ci.yml, because a job
# skipped by `if:` reports success and satisfies a required status check, while a reusable
# workflow that is never called produces no check at all. It tests the author as well as the
# branch name: on its own, the name would let any PR, a fork's included, call its branch
# release-please--x and skip every required check, which branch protection counts as met.
# github.actor is the third clause, and it is the pusher rather than the PR author, so a
# human commit pushed onto the Release PR to fix a conflict or a changelog entry is tested
# like any other commit instead of riding the skip into main untested.
jobs:
  ruff:
    if: >-
      ${{ !(github.actor == 'github-actions[bot]'
      && github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--')) }}
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
      - name: Run linter
        run: make lint

  typecheck:
    if: >-
      ${{ !(github.actor == 'github-actions[bot]'
      && github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--')) }}
    name: Type Check (ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
      - name: Run type checker
        run: make typecheck

  # ── Non-video tests (chat, feeds, etc.) ────────────────────────────
  # Uses STREAM_CHAT_* credentials which do NOT have video enabled.
  # Video paths and manual test paths are defined in the Makefile.
  test-non-video:
    if: >-
      ${{ !(github.actor == 'github-actions[bot]'
      && github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--')) }}
    name: Non-video tests (${{ matrix.python-version }})
    environment:
      name: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          STREAM_API_KEY: ${{ vars.STREAM_CHAT_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_CHAT_API_SECRET }}
          STREAM_BASE_URL: ${{ vars.STREAM_CHAT_BASE_URL }}
        run: make test MARKER="${{ inputs.marker }}"

  # ── Video tests (video-enabled credentials) ─────────────────────
  # Uses STREAM_* credentials which have video enabled.
  test-video:
    if: >-
      ${{ !(github.actor == 'github-actions[bot]'
      && github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--')) }}
    name: Video tests (${{ matrix.python-version }})
    environment:
      name: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
        run: make test-video MARKER="${{ inputs.marker }}"
