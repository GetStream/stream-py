name: _run-tests
on:
  workflow_call:
    secrets: { }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # If set, uv will run without updating the uv.lock file. Equivalent to the `uv run --frozen`.
  UV_FROZEN: "1"

permissions:
  contents: read

# The unit lane, and it is offline. Every test that talks to a live Stream app carries
# `@pytest.mark.integration`, and pytest's default expression here is `not integration`, so
# these jobs declare no environment and receive no credentials. That is deliberate and it is
# load-bearing twice over: a pull request from a fork, which gets no secrets, still goes
# green, and a live test added without the marker fails loudly here instead of quietly
# passing on someone else's credentials.
#
# The `integration` marker lives in run_integration.yml, which only the daily schedule and
# release.yml call, so a shared-app failure can never block a merge.
#
# There is no Release PR guard in this file. It sits on the calling job in ci.yml, which is
# the only caller that can see a pull request at all, and ci.yml's `🧪 Tests` job publishes
# the required status check whether or not this workflow ran.
jobs:
  ruff:
    name: 🧪 Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
      - name: Run linter
        run: make lint

  typecheck:
    name: 🧪 Type Check (ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
      - name: Run type checker
        run: make typecheck

  # ── Non-video tests (chat, feeds, etc.) ────────────────────────────
  # Uses STREAM_CHAT_* credentials which do NOT have video enabled.
  # Video paths and manual test paths are defined in the Makefile.
  test-non-video:
    name: 🧪 Non-video tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: make test

  # ── Video tests (video-enabled credentials) ─────────────────────
  # Uses STREAM_* credentials which have video enabled.
  test-video:
    name: 🧪 Video tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        uses: ./.github/actions/python-uv-setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: make test-video
