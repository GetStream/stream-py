name: Python + uv setup
description: Checkout, set up uv/Python, and sync dev deps
inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  sync-flags:
    description: Extra flags for uv sync (e.g., --all-extras --dev)
    required: false
    default: "--all-extras --dev --frozen"
  working-directory:
    description: Directory to run in
    required: false
    default: "."
  build-extension:
    description: Build getstream-rtc (the Rust extension) into the environment; "false" installs everything else
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install the native build dependencies
      if: ${{ inputs.build-extension == 'true' }}
      shell: bash
      # libvpx is linked from the system; bindgen needs libclang to generate its bindings.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libvpx-dev libclang-dev

    - name: Install the Rust toolchain
      if: ${{ inputs.build-extension == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}/getstream-rtc
      # Installs the toolchain pinned in getstream-rtc/rust-toolchain.toml.
      run: rustup toolchain install

    - name: Cache the Rust build
      if: ${{ inputs.build-extension == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.working-directory }}/getstream-rtc

    - name: Install the latest version of uv
      id: setup_uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        version: "latest"
        enable-cache: true
        prune-cache: false
        cache-suffix: ${{ inputs.python-version }}
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock

    - name: Log cache status
      shell: bash
      run: |
        echo "uv download cache hit: ${{ steps.setup_uv.outputs['cache-hit'] }}"
        echo ".venv cache hit: ${{ steps.cache_venv.outputs.cache-hit }}"

    - name: Install the project dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.sync-flags }} ${{ inputs.build-extension != 'true' && '--no-install-package getstream-rtc' || '' }}
