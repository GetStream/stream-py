name: Build the getstream-rtc wheel
description: >-
  Builds the getstream-rtc wheel of the runner's platform into wheel-dir, and
  checks it in a clean environment. Linux builds run in the manylinux_2_28
  container; macOS builds support macOS 11 or later.
inputs:
  cache:
    description: >-
      "true" restores and saves the sccache and Cargo download caches. Release
      builds keep "false": Cargo does not check a cached crate again.
    required: false
    default: "false"
outputs:
  wheel-dir:
    description: The directory that holds the wheel
    value: ${{ github.workspace }}/rtc-wheel
runs:
  using: composite
  steps:
    - name: Cache the Cargo downloads
      if: inputs.cache == 'true' && runner.os == 'Linux'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Mounted at /root/.cargo in the container (docker-options below).
        path: ${{ github.workspace }}/.cargo-container
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('getstream-rtc/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache the Cargo downloads
      if: inputs.cache == 'true' && runner.os == 'macOS'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('getstream-rtc/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

    - name: Build the wheel
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      env:
        MACOSX_DEPLOYMENT_TARGET: "11.0"
      with:
        working-directory: getstream-rtc
        manylinux: "2_28"
        args: --release --locked --out ${{ github.workspace }}/rtc-wheel
        sccache: ${{ inputs.cache }}
        docker-options: >-
          ${{ inputs.cache == 'true' && format('-v {0}/.cargo-container/registry:/root/.cargo/registry -v {0}/.cargo-container/git:/root/.cargo/git', github.workspace) || '' }}

    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: false

    - name: Check the wheel
      shell: bash
      run: |
        venv="$RUNNER_TEMP/rtc-wheel-check"
        uv venv --quiet --python 3.12 "$venv"
        uv pip install --quiet --python "$venv" "$GITHUB_WORKSPACE"/rtc-wheel/*.whl
        extension="$("$venv/bin/python" -c 'import getstream_rtc._bindings as b; print(b.__file__)')"
        if [ "$RUNNER_OS" = macOS ]; then
          libraries="$(otool -L "$extension")"
        else
          libraries="$(readelf -d "$extension" | grep NEEDED)"
        fi
        echo "$libraries"
        if grep -qi vpx <<< "$libraries"; then
          echo "::error::The extension links libvpx dynamically."
          exit 1
        fi
