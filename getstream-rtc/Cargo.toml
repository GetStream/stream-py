[package]
name = "getstream-rtc"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "_bindings"
path = "rustsrc/lib.rs"
crate-type = ["cdylib"]

[dependencies]
getstream = { git = "https://github.com/GetStream/stream-video-rust", rev = "edd995b269471e53d40371a15dda007549bad6f8" }
log = "0.4"
numpy = "0.29"
prost-types = "0.14"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
